<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Contact</title>
</head>

<body>
    <header>
        <a href="./index.html" class="title">Développement web</a>
    </header>
    <main>
        <nav class="nav-menu">
            <input id="menu__toggle" type="checkbox">
            <label class="menu__btn" for="menu__toggle">
                <span></span>
            </label>
            <ul class="menu__box">
                <li>
                    <a href="./html.html" class="langage">HTML</a>
                </li>
                <li>
                    <a href="./ccs.html" class="langage">CSS</a>
                </li>
                <li>
                    <a href="./javascript.html" class="langage">JavaScript</a>
                </li>
                <li>
                    <a href="./contact.html" class="menu-contact"><strong>Contact</strong></a>
                </li>
            </ul>
        </nav>
        <section>
            <h1 class="contact-title">Vous avez des questions ?</h1>
        </section>
        <section id="section-article">
            <h2 class="intro">Introduction</h2>
            <article class="contact-article">
                <h3 class="contact-info">Contactez-nous</h3>
                <form class="contact-form">
                    <input type="text" name="name" required class="name" placeholder="Nom">
                    <input type="email" name="email" required class="email" placeholder="Email">
                    <textarea name="message" id="message" required placeholder="Message" rows="5"></textarea>
                    <div class="form-button">
                        <a href="#popup" class="form-button"><strong>Envoyer</a>
                    </div>
                    <div id="popup" class="popup">
                        <div class="popup-content">
                            <p>Message envoyé</p>
                            <a href="#section-article" class="form-button">Fermer</a>
                        </div>
                    </div>
                </form>
            </article>
            <article class="contact-article">
                <h3 class="contact-info">École Ri7</h3>
                <p class="contact-info">École Supérieure de Développement Web</p>
                <p class="contact-info">155 Rue du Dirigeable, <br>13400 Aubagne</p>
                <p class="contact-info"><strong> 06 83 78 17 91</strong></p>
            </article>
        </section>
    </main>

    <footer>
        <div class="footer-image">
            <p>Suivez-nous:</p>
            <nav>
                <div>
                    <a href="https://www.facebook.com/?locale=fr_FR" target="_blank"><img src="./images/facecat.jpg"
                            alt="facecat"></a>
                </div>
                <div>
                    <a href="https://www.instagram.com/" target="_blank"><img src="./images/catter.jpg"
                            alt="catter"></a>
                </div>
                <div>
                    <a href="https://www.youtube.com/?app=desktop&hl=FR" target="_blank"><img src="./images/youcat.jpg"
                            alt="youcat"></a>
                </div>
                <div>
                    <a href="https://fr.pinterest.com/" target="_blank"><img src="./images/caterest.jpg"
                            alt="caterest"></a>
                </div>
            </nav>
        </div>
    </footer>
</body>

</html>
